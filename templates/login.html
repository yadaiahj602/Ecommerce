<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopEase</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            color: #2563eb;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .forgot {
            text-align: right;
            margin-top: 12px;
        }

        .forgot a,
        .register a {
            color: #2563eb;
            text-decoration: none;
        }

        .register {
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">ShopEase</div>

    <h2>Login</h2>

    <form method="POST">
        {% csrf_token %}
        <label>Username</label>
        <input type="text" placeholder="Enter your username" name="username">

        <label>Password</label>
        <input type="password" placeholder="Enter your password" name='password'>

        <div class="forgot">
            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">Login</button>

    </form>

    <div class="register">
        <p>Don't have an account?</p>
        <br>
        <a href="register.html">Create an Account</a>
    </div>

</div>

</body>
</html>
