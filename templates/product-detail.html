{% extends "base.html" %}
{% load static %}
{% block content %}
</style>
<section class="section-content padding-y bg">
<div class="container">

<!-- ============================ COMPONENT 1 ================================= -->
<div class="card">
	<div class="row no-gutters">
		<aside class="col-md-6">
<article class="gallery-wrap"> 
	<div class="img-big-wrap">
	   <a href="#"><img src="{{ single_pro.images.url }}"></a>
	</div> <!-- img-big-wrap.// -->
	
</article> <!-- gallery-wrap .end// -->
		</aside>
		<main class="col-md-6 border-left">

			<form action="{% url 'add_cart' single_pro.id %}" method="POST">
				{% csrf_token %}
<article class="content-body">

<h2 class="title">{{ single_pro.product_name }}</h2>

<div class="mb-3"> 
	<var class="price h4">${{ single_pro.price }}</var> 
</div> 

<p>{{ single_pro.desc }}</p>


<hr>
	<div class="row">
		<div class="item-option-select">
			<h6>Choose Color</h6>
			 <select name="color" class="form-control" required>
				<option value="" disabled selected>Choose Color</option>
				{% for i in single_pro.variation_set.colors %}
				<option value="{{ i.variation_value | lower }}">{{ i.variation_value | capfirst }}</option>
				{% endfor %}
			 </select>
		</div>
	</div> <!-- row.// -->
	 <div class="row">
		<div class="item-option-select">
			<h6>Select Size</h6>
			<select name="size" class="form-control">
				<option value="" disabled selected>Choose Size</option>
				{% for i in single_pro.variation_set.sizes %}
				<option value="{{ i.variation_value | lower }}">{{ i.variation_value | capfirst }}</option>
				{% endfor %}
				</select>
			</div> 
		</div>
	</div> <!-- row.// --> 
	<hr>
{% if single_pro.stock <= 0  %}
	<h5 class="text-danger"> Out of stock</h5>
{% else %}
<button type="submit" class="btn btn-primary"><span class="text"></span>Add to Cart</button>
<br>
	<a href="{% url 'cart' %}" class="btn  btn-outline-primary"> <span class="text">View cart</span> <i class="fas fa-eye"></i></a>
{% endif %}

</article> 
</form>
		</main> <!-- col.// -->
	</div> <!-- row.// -->
</div> <!-- card.// -->
<!-- ============================ COMPONENT 1 END .// ================================= -->
<br>
</div> <!-- container .//  -->
</section>
<!-- ========================= SECTION CONTENT END// ========================= -->

{% endblock  %}
